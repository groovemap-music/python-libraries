[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "groovemap-runtime"
version = "0.1.0"
description = "Runtime resilience, health, normalization, and observability primitives for GrooveMap services"
authors = [{name = "Robert Wlodarczyk", email = "robert@simplicityguy.com"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "orjson>=3.12.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.26.0"]
neo4j = ["neo4j-rust-ext>=6.2.0.0"]
otel = ["opentelemetry-api>=1.40.0", "opentelemetry-exporter-otlp-proto-http>=1.40.0", "opentelemetry-instrumentation-system-metrics>=0.61b0", "opentelemetry-sdk>=1.40.0"]
otel-http = ["opentelemetry-instrumentation-fastapi>=0.61b0", "opentelemetry-instrumentation-httpx>=0.61b0"]
postgres = ["psycopg[binary]>=3.3.4"]
rabbitmq = ["aio-pika>=10.0.1", "pika>=1.4.4"]
all = [
    "aio-pika>=10.0.1",
    "neo4j-rust-ext>=6.2.0.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-system-metrics>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "pika>=1.4.4",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
]

[project.urls]
Homepage = "https://groovemap.music"
Repository = "https://github.com/groovemap-music/python-libraries"
Issues = "https://github.com/groovemap-music/python-libraries/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "commitizen>=4.18.0",
    "cyclonedx-bom>=7.3.1",
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/src"]

[tool.uv]
exclude-newer = "2 days"

[tool.uv.workspace]
members = ["agent-tools"]

[tool.uv.sources]
groovemap-runtime = {workspace = true}

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PLC", "PTH", "RUF", "S", "SIM", "T20", "TCH", "UP", "W"]
ignore = ["B008", "C901", "E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["common"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = ["PLC", "S105", "T201"]
"scripts/*.py" = ["S108", "T201"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
packages = ["common"]

[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
markers = [
    "benchmark: performance regression benchmarks",
    "e2e: end-to-end tests requiring external services",
    "integration: tests requiring a live backing service",
]

[tool.coverage.run]
source = ["common"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
# This repository was extracted from the GrooveMap monorepo and inherited its full history, so
# an unscoped changelog would credit groovemap-runtime with dashboards, OAuth flows, and other
# monorepo features these two distributions never contained. Start the changelog at the commit
# before the extraction, so it covers this repository's own history and nothing earlier.
changelog_start_rev = "ee3c44c35eb5f6d1eb8d57e6ee7e423d02cd8292"
version_provider = "uv"
version_scheme = "pep440"
version_files = ["agent-tools/pyproject.toml"]
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
