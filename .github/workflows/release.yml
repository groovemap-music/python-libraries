name: Release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@2f34a4da5c552bc23c75edd3d8d81be0a4b3271c
    with:
      runner: ubuntu-24.04
      repository-name: python-libraries
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
        dist/provenance.json
