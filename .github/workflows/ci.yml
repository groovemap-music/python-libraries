name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    uses: groovemap-music/automation/.github/workflows/reusable-ci.yml@dbf22ed83d486e9484fc8c6385c7c3e5995700e4
    with:
      runner: ubuntu-24.04
      language: python
      setup-command: |
        just setup

        rabbitmq_max_start_attempts=3
        rabbitmq_max_ping_attempts=30

        start_rabbitmq() {
          docker rm -f -v python-libraries-rabbitmq >/dev/null 2>&1 || true
          docker run --detach \
            --name python-libraries-rabbitmq \
            --hostname python-libraries-rabbitmq \
            --user rabbitmq \
            --publish 5672:5672 \
            --publish 15672:15672 \
            --env RABBITMQ_DEFAULT_USER=groovemap \
            --env RABBITMQ_DEFAULT_PASS=groovemap \
            --env "RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq_management disable_management_stats false" \
            rabbitmq:4-management@sha256:ffd1b50c522ad20172ffd6716a2f41db375c7269560c8f3fb9a694e210ef0852
        }

        wait_for_rabbitmq() {
          for attempt in $(seq 1 "${rabbitmq_max_ping_attempts}"); do
            container_status="$(docker inspect --format '{{.State.Status}}' python-libraries-rabbitmq 2>/dev/null || echo missing)"
            if [[ "${container_status}" != "running" ]]; then
              echo "::warning::python-libraries-rabbitmq is '${container_status}' (ping attempt ${attempt}/${rabbitmq_max_ping_attempts}); broker exited before answering ping"
              return 1
            fi
            if docker exec python-libraries-rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              return 0
            fi
            sleep 2
          done
          echo "::warning::python-libraries-rabbitmq did not answer ping after ${rabbitmq_max_ping_attempts} attempts"
          return 1
        }

        rabbitmq_ready=false
        for start_attempt in $(seq 1 "${rabbitmq_max_start_attempts}"); do
          start_rabbitmq
          if wait_for_rabbitmq; then
            rabbitmq_ready=true
            break
          fi
          echo "::warning::rabbitmq start attempt ${start_attempt}/${rabbitmq_max_start_attempts} failed"
          sleep 2
        done

        if [[ "${rabbitmq_ready}" != "true" ]]; then
          echo "::error::python-libraries-rabbitmq failed to become ready after ${rabbitmq_max_start_attempts} start attempts"
          docker logs python-libraries-rabbitmq 2>&1 || echo "::error::no logs available for python-libraries-rabbitmq; the container was removed"
          exit 1
        fi

        # The batch engine's channel-loss tests need PostgreSQL as well as the broker; without it
        # they skip, and only a mock would be left to catch a regression.
        docker rm -f -v python-libraries-postgres >/dev/null 2>&1 || true
        docker run --detach \
          --name python-libraries-postgres \
          --publish 5432:5432 \
          --env POSTGRES_USER=groovemap \
          --env POSTGRES_PASSWORD=groovemap \
          --env POSTGRES_DB=groovemap \
          postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        postgres_ready=false
        for attempt in $(seq 1 30); do
          if docker exec python-libraries-postgres pg_isready --quiet --host 127.0.0.1 --username groovemap --dbname groovemap; then
            postgres_ready=true
            break
          fi
          sleep 1
        done
        if [[ "${postgres_ready}" != "true" ]]; then
          echo "::error::python-libraries-postgres did not become ready"
          docker logs python-libraries-postgres 2>&1 || true
          exit 1
        fi

        {
          echo "RABBITMQ_HOST=127.0.0.1"
          echo "RABBITMQ_USERNAME=groovemap"
          echo "RABBITMQ_PASSWORD=groovemap"
          echo "POSTGRES_HOST=127.0.0.1"
          echo "POSTGRES_USER=groovemap"
          echo "POSTGRES_PASSWORD=groovemap"
          echo "POSTGRES_DB=groovemap"
        } >> "${GITHUB_ENV}"
      check-command: just check
      coverage-command: just coverage
      audit-command: just audit
      license-command: just license-check
      secret-scan-command: just secret-scan
      package-command: just build
      install-command: just install-check
      integration-command: just test-integration
      coverage-files: coverage.xml
      coverage-flags: python,libraries
      upload-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
